[package]
name = "galvanizer_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
console = "0.16.1"
dialoguer = "0.12.0"
env_logger = "0.11.8"
galvanizer_config = { path = "../galvanizer_config" }
galvanizer_store = { path = "../galvanizer_store" }
glob = "0.3.3"
indicatif = "0.18.3"
rayon = "1.11.0"
log = "0.4.28"
toml = { version = "0.9.8", features = ["serde"] }
crossbeam = "0.8.4"
globset = "0.4.18"
walkdir = "2.5.0"
bytesize = "2.3.1"

[dependencies.clap]
version = "4.5.53"
features = ["derive", "env"]

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dev-dependencies]
tempfile = "3.23.0"
